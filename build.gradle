plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories {
    mavenCentral()
    maven { url = 'https://maven.terraformersmc.com/' }
    maven { url = 'https://maven.nucleoid.xyz/' }
}
loom {
    splitEnvironmentSourceSets()
    mods {
        'redstone_trail' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    if (!project.hasProperty('withoutModMenu')) {
        runtimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
        runtimeOnly "eu.pb4:placeholder-api:${project.placeholder_api_version}"
    }
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
java { withSourcesJar() }
sourceSets {
    modelTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
tasks.register('modelTest', JavaExec) {
    dependsOn modelTestClasses
    classpath = sourceSets.modelTest.runtimeClasspath
    mainClass = 'io.github.ruok0214.redstonetrail.TrailBookTest'
    enableAssertions = true
}
check.dependsOn modelTest
jar { from('LICENSE') { rename { "${it}_${project.archives_base_name}" } } }
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'redstone_trail_test'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}
dependencies { gametestCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}" }
